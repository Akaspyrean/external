      - name: Count rules
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          names = ["direct", "proxy", "ai", "media", "ad"]

          list_counts = {}
          yaml_counts = {}
          mismatches = {}

          for name in names:
              list_path = Path("rules") / f"{name}.list"
              yaml_path = Path("rules") / f"{name}.yaml"

              # .list：忽略空行和注释
              list_count = sum(
                  1
                  for line in list_path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines()
                  if line.strip()
                  and not line.lstrip().startswith("#")
              )

              # .yaml：统计 payload 下的规则项
              yaml_count = sum(
                  1
                  for line in yaml_path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines()
                  if line.lstrip().startswith("- ")
              )

              list_counts[name] = list_count
              yaml_counts[name] = yaml_count

              if list_count != yaml_count:
                  mismatches[name] = {
                      "list": list_count,
                      "yaml": yaml_count
                  }

          # 两种格式内容重复，因此总数只计算一次
          total = sum(list_counts.values())

          def human(value):
              if value >= 1_000_000:
                  text = f"{value / 1_000_000:.2f}".rstrip("0").rstrip(".")
                  return f"{text}M"

              if value >= 1_000:
                  text = f"{value / 1_000:.1f}".rstrip("0").rstrip(".")
                  return f"{text}K"

              return str(value)

          stats = {
              "total": total,
              "display": human(total),
              "updated": datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat(),
              "rules": {
                  name: {
                      "list": list_counts[name],
                      "yaml": yaml_counts[name]
                  }
                  for name in names
              },
              "formats_consistent": not bool(mismatches),
              "mismatches": mismatches
          }

          Path("stats.json").write_text(
              json.dumps(
                  stats,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
